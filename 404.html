<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chelluna B-Day</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; text-align: center; padding: 16px;
      box-sizing: border-box; font-family: system-ui, sans-serif;
      color: #fff; background: linear-gradient(135deg, #0F0C29, #302B63, #24243E);
    }
    a {
      display: inline-block; padding: 18px 36px; border-radius: 40px;
      color: #fff; font-size: 22px; font-weight: 800; text-decoration: none;
      background: linear-gradient(90deg, #FF4D8D, #FF9A3C);
    }
    p { font-size: 18px; opacity: .8; }
  </style>
</head>
<body>
  <main>
    <div style="font-size: 72px">✨</div>
    <p>Apri questo QR con l'app</p>
    <a id="open" href="#">Apri l'app</a>
  </main>
  <script>
    // Seen only when the link opens in the browser instead of the app: the
    // button hands the same link to the app.
    const path = location.pathname;
    if (path.startsWith('/q/')) {
      document.getElementById('open').href =
        'intent://' + location.host + path +
        '#Intent;scheme=https;package=com.moretz95.bday_app;end';
    } else {
      location.replace('/');
    }
  </script>
</body>
</html>
